schema_version: 1

context:
  name: ewah-bool-utils
  version: "1.3.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/ewah_bool_utils-${{ version }}.tar.gz
  sha256: 9e1d472724debba95cdc8bd1ac7a082a84ce263dcf4e2700b20954fc9c0a5d65

build:
  number: 1
  skip: (is_abi3 and not is_python_min) or python_impl == 'pypy'
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    version_independent: ${{ true if is_abi3 }}

requirements:
  build:
    - if: match(python, ">=3.11") and is_abi3
      then: python-abi3
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: cython
    - if: build_platform != target_platform
      then: numpy
    - if: build_platform != target_platform
      then: meson-python
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
  host:
    - python
    - cython
    - numpy
    - meson-python
    - pip
  run:
    - python

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - ewah_bool_utils
      pip_check: true
  - requirements:
      run:
        - pip
        - if: is_abi3
          then: abi3audit
    script:
      - if: unix and is_abi3
        then: abi3audit $SP_DIR/ewah_bool_utils/*.abi3.so -s -v --assume-minimum-abi3 3.11
      - if: win and is_abi3
        then: abi3audit %SP_DIR%/ewah_bool_utils/ewah_bool_wrap.pyd -s -v --assume-minimum-abi3 3.11

about:
  summary: EWAH Bool Array utils for yt
  license: Apache-2.0 AND BSD-3-Clause
  license_file:
    - LICENSE
    - src/ewah_bool_utils/cpp/LICENSE
  homepage: https://pypi.org/project/ewah-bool-utils/

extra:
  recipe-maintainers:
    - neutrinoceros
    - matthewturk
